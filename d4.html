<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</head>

<body>

<img id="image" src="images/d4.png" style="display:none;">

<h1 id="message" style="color:white;text-align:center;"></h1>

<script>

if(
    localStorage.getItem("D1") &&
    localStorage.getItem("D2") &&
    localStorage.getItem("D3")
){

    document.getElementById("image").style.display = "block";

    localStorage.setItem("D4","true");

}else{

    document.getElementById("message").innerHTML =
    "Vous devez trouver D1, D2 puis D3 avant de pouvoir accéder à cette image.";

}

</script>

</body>

</html>
