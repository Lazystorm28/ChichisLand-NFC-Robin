<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="style.css">

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</head>

<body>

<img id="image" src="images/b4.png" style="display:none;">

<h1 id="message" style="color:white;text-align:center;"></h1>

<script>

if(
    localStorage.getItem("B1") &&
    localStorage.getItem("B2") &&
    localStorage.getItem("B3")
){

    document.getElementById("image").style.display = "block";

    localStorage.setItem("B4","true");

}else{

    document.getElementById("message").innerHTML =
    "Trop tôt jeune scarabée";

}

</script>

</body>

</html>
